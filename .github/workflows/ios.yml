name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate and normalize app icon
        run: |
          ICON="Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          test -f "$ICON"
          sips -s format png -z 1024 1024 "$ICON" --out "$ICON"
          swift - "$ICON" <<'SWIFT'
          import AppKit
          import Foundation

          let path = CommandLine.arguments[1]
          let url = URL(fileURLWithPath: path)
          guard let source = NSImage(contentsOf: url) else {
              fatalError("AppIcon.png is not a readable image")
          }
          let size = NSSize(width: 1024, height: 1024)
          let output = NSImage(size: size)
          output.lockFocus()
          NSColor.white.setFill()
          NSBezierPath(rect: NSRect(origin: .zero, size: size)).fill()
          source.draw(in: NSRect(origin: .zero, size: size), from: NSRect(origin: .zero, size: source.size), operation: .sourceOver, fraction: 1)
          output.unlockFocus()
          guard let tiff = output.tiffRepresentation,
                let bitmap = NSBitmapImageRep(data: tiff),
                let png = bitmap.representation(using: .png, properties: [:]) else {
              fatalError("Could not normalize app icon")
          }
          try png.write(to: url, options: .atomic)
          SWIFT
      - name: Download iOS ARM64 Java runtimes
        run: |
          set -euo pipefail
          mkdir -p ServerHost/JavaRuntimes
          for VERSION in 8 17 21 25; do
            WORK="$(mktemp -d)"
            curl -fL "https://assets.angelauramc.dev/openjdk/ios-arm64/jre${VERSION}-ios-aarch64.zip" -o "$WORK/runtime.zip"
            unzip -q "$WORK/runtime.zip" -d "$WORK/unpacked"
            ARCHIVE="$(find "$WORK/unpacked" -name "jre${VERSION}-*.tar.xz" -print -quit)"
            test -n "$ARCHIVE"
            DEST="ServerHost/JavaRuntimes/java-${VERSION}-openjdk"
            mkdir -p "$DEST"
            tar -xJf "$ARCHIVE" -C "$DEST"
            rm -rf "$DEST/bin" "$DEST/include" "$DEST/legal" "$DEST/man" "$DEST/jre"
            rm -rf "$DEST/lib/ct.sym" "$DEST/lib/jspawnhelper" "$DEST/lib/libjsig.dylib" "$DEST/lib/src.zip" "$DEST/lib/tools.jar"
            test -f "$DEST/release"
            if [ "$VERSION" = "8" ]; then
              test -f "$DEST/lib/jli/libjli.dylib"
            else
              test -f "$DEST/lib/libjli.dylib"
            fi
            rm -rf "$WORK"
          done
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: xcodebuild -project ServerHost.xcodeproj -scheme ServerHost -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Verify bundled Java runtimes
        run: |
          APP="build/Build/Products/Release-iphoneos/ServerHost.app"
          for VERSION in 8 17 21 25; do
            RUNTIME="$APP/JavaRuntimes/java-${VERSION}-openjdk"
            test -f "$RUNTIME/release"
            if [ "$VERSION" = "8" ]; then
              test -f "$RUNTIME/lib/jli/libjli.dylib"
            else
              test -f "$RUNTIME/lib/libjli.dylib"
            fi
          done
          du -sh "$APP/JavaRuntimes"
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ServerHost.app Payload/
          zip -r ServerHost-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ServerHost-unsigned-ipa
          path: ServerHost-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
